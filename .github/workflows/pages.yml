name: Build and deploy to GitHub Pages

# Based on GitHub's Nuxt starter workflow (actions/starter-workflows pages/nuxtjs.yml).
# The site is static: every run fetches the PR list and regenerates the pages.
# The 10-minute cron is what keeps the wall fresh (the page shows "stale" after 15 minutes).
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

# The build job runs pnpm install, so it gets read access only. Publishing
# rights (pages, the OIDC token) belong to the deploy job, which runs no
# third-party package code.
permissions:
  contents: read
  pages: read # configure-pages reads the site's base URL

# Overlapping runs would only race to publish the same content.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to commit SHAs (a tag can be moved to other code);
      # Dependabot proposes the updates. Nothing here pushes, so the checkout
      # keeps no token on disk.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: pnpm install --frozen-lockfile
      # Code changes are checked before they publish; the 10-minute data refresh
      # runs the same commit, so it skips the checks.
      - name: Lint, typecheck, test
        if: github.event_name != 'schedule'
        run: pnpm lint && pnpm typecheck && pnpm test
      - name: Generate the static site
        run: pnpm exec nuxi generate
        env:
          NUXT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
          HIDE_PRIVATE_REPOS: 'true'
          # The portfolio's Patches page counts from this feed, so it must hold
          # every open and merged PR, not only the newest 50.
          PR_COUNT: '500'
          # PRs that only maintain this site and its domains are not contributions,
          # and the course repo is coursework, not upstream review.
          EXCLUDE_REPOS: is-a-dev/register,${{ github.repository }},chihmingyang/cs2680
          # From the Pages settings: '' and the custom domain once one is set,
          # '/my-pull-requests' and the github.io URL before that.
          NUXT_APP_BASE_URL: ${{ steps.pages.outputs.base_path }}/
          NUXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
