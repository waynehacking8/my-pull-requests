name: Build and deploy to GitHub Pages

# Based on GitHub's Nuxt starter workflow (actions/starter-workflows pages/nuxtjs.yml).
# The site is static: every run fetches the PR list and regenerates the pages.
# The Cloudflare dispatcher (tools/dispatcher) starts this every 10 minutes via
# workflow_dispatch; GitHub's own cron below only fires a few times a day and is
# the fallback (the page shows "stale" after 15 minutes).
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

# The build job runs pnpm install, so it gets read access only. Publishing
# rights (pages, the OIDC token) belong to the deploy job, which runs no
# third-party package code.
permissions:
  contents: read
  pages: read # configure-pages reads the site's base URL

# Overlapping runs would only race to publish the same content.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      generated-at: ${{ steps.stamp.outputs.generated-at }}
    steps:
      # Actions are pinned to commit SHAs (a tag can be moved to other code);
      # Dependabot proposes the updates. Nothing here pushes, so the checkout
      # keeps no token on disk.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: pnpm install --frozen-lockfile
      # Code changes are checked before they publish; the data refreshes (cron
      # and the Cloudflare dispatcher in tools/dispatcher) run the same commit,
      # so they skip the checks.
      - name: Lint, typecheck, test
        if: github.event_name == 'push'
        run: pnpm lint && pnpm typecheck && pnpm test && node --test tools/dispatcher/test.mjs
      - name: Generate the static site
        run: pnpm exec nuxi generate
        env:
          NUXT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
          HIDE_PRIVATE_REPOS: 'true'
          # The portfolio's Patches page counts from this feed, so it must hold
          # every open and merged PR, not only the newest 50.
          PR_COUNT: '500'
          # PRs that only maintain this site and its domains are not contributions,
          # and the course repo is coursework, not upstream review.
          EXCLUDE_REPOS: is-a-dev/register,${{ github.repository }},chihmingyang/cs2680
          # From the Pages settings: '' and the custom domain once one is set,
          # '/my-pull-requests' and the github.io URL before that.
          NUXT_APP_BASE_URL: ${{ steps.pages.outputs.base_path }}/
          NUXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
      # Unique per build; the deploy job checks the live site serves it.
      - id: stamp
        run: |
          stamp=$(jq -er .generatedAt .output/public/api/contributions.json)
          echo "generated-at=$stamp" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      # deploy-pages tracks a deployment by commit SHA, and the refreshes redeploy
      # the same commit, so "success" can belong to an older deploy while Pages
      # keeps serving an old build (actions/deploy-pages#383; 8 hours stale on
      # 2026-11-10). Fail loudly instead.
      - name: Check the live site serves this build
        env:
          URL: ${{ steps.deployment.outputs.page_url }}api/contributions.json
          WANT: ${{ needs.build.outputs.generated-at }}
        run: |
          for i in $(seq 18); do
            got=$(curl -fsS "$URL?run=$GITHUB_RUN_ID-$i" | jq -r .generatedAt) || got=
            [ "$got" = "$WANT" ] && exit 0
            sleep 10
          done
          echo "::error::Pages serves the build from $got, not this one ($WANT). Push any commit so the next deploy has a new SHA (docs/HANDOFF.md)."
          exit 1
