# Weekly update PRs for the SHA-pinned actions and the pnpm lockfile.
# Actions get a 7-day cooldown, so a compromised release has time to be caught
# upstream before it lands here. npm gets none: Dependabot passes the cooldown
# to pnpm as minimum-release-age, which also rejects packages the lockfile
# already pins if they are under a week old, so every update job failed with
# ERR_PNPM_NO_MATCHING_VERSION after any fresh install (2026-11-05).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
