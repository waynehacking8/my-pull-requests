# Weekly update PRs for the SHA-pinned actions and the pnpm lockfile. The
# cooldown skips releases younger than a week, so a compromised release has
# time to be caught upstream before it lands here. Security updates are not
# delayed by it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
